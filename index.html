<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampul MPI: Transformasi Geometri - Fase D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --krem: #FFF7EC;
    --krem-2: #F7EEE3;
    --tinta: #3E2F25;
    --tinta-lembut: #8A7563;
    --jingga: #FF8A3D;
    --biru: #3E8FEA;
    --hijau: #34B36B;
    --ungu: #8B62E6;
    --merah: #F0577A;
    --kuning: #FFC43D;
    --putih: #ffffff;
    --b-sedang: 0 12px 30px -14px rgba(62,47,37,0.3);
    --b-besar: 0 20px 40px -10px rgba(62,47,37,0.2);
    --r-besar: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--tinta);
    background: #0B0B2A; /* Fallback warna gelap angkasa */
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    touch-action: none; /* Mencegah pull-to-refresh di mobile */
  }

  .latar {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image: url('Lanskap Kosmik Pastel Penuh Bintang.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Grid samar-samar ala buku matematika */
  .grid-pattern {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.15; /* Diperhalus agar bintang tetap terlihat */
    background-size: 40px 40px;
    background-image: 
      linear-gradient(to right, #ffffff 1px, transparent 1px),
      linear-gradient(to bottom, #ffffff 1px, transparent 1px);
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
  }

  .wadah-utama {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.75); /* Kaca sedikit lebih tebal agar kontras */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 3px solid rgba(255,255,255,0.8);
    border-radius: var(--r-besar);
    padding: clamp(30px, 5vw, 60px);
    text-align: center;
    box-shadow: var(--b-besar), inset 0 0 20px rgba(255,255,255,0.5);
    max-width: 90%;
    width: 600px;
    transform: translateY(20px);
    animation: munculKaca 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }

  @keyframes munculKaca {
    to { transform: translateY(0); opacity: 1; }
    from { transform: translateY(40px); opacity: 0; }
  }

  .label-fase {
    display: inline-block;
    background: var(--kuning);
    color: var(--tinta);
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1rem, 2vw, 1.2rem);
    font-weight: 800;
    padding: 6px 20px;
    border-radius: 999px;
    border: 2px solid var(--tinta);
    box-shadow: 4px 4px 0 var(--tinta);
    margin-bottom: 20px;
    transform: rotate(-2deg);
  }

  h1.judul {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    line-height: 1.1;
    margin-bottom: 15px;
    color: var(--biru);
    text-shadow: 3px 3px 0px var(--tinta);
  }
  
  h1.judul span { color: var(--merah); }

  p.deskripsi {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 700;
    color: var(--tinta-lembut);
    margin-bottom: 30px;
  }

  .kredit {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px dashed rgba(138, 117, 99, 0.3);
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--tinta-lembut);
  }
  .kredit b { color: var(--tinta); font-size: 1rem;}

  .tbl-mulai {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--jingga);
    color: var(--putih);
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 800;
    padding: 14px 40px;
    border-radius: 999px;
    border: 3px solid var(--tinta);
    box-shadow: 0 8px 0 var(--tinta), 0 15px 20px rgba(255, 138, 61, 0.4);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.3, 1.5, 0.5, 1);
  }

  .tbl-mulai:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 0 var(--tinta), 0 20px 25px rgba(255, 138, 61, 0.5);
    background: #ff9d5c;
  }

  .tbl-mulai:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--tinta);
  }

  .tbl-mulai svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
    animation: denyut 1.5s infinite alternate;
  }

  @keyframes denyut {
    to { transform: scale(1.15); }
  }

  .kanvas-animasi {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none; /* Kursor tembus ke layar bawah */
  }

  .karakter {
    position: absolute;
    filter: drop-shadow(0 10px 15px rgba(62,47,37,0.15));
    transition: transform 0.1s ease-out; /* Untuk efek paralaks halus */
  }

  /* Animasi Khusus Masing-Masing Karakter Transformasi */
  
  /* 1. Translasi (Segitiga Biru Meluncur) */
  .translasi-obj {
    top: 15%;
    left: 10%;
    animation: luncur 4s ease-in-out infinite alternate;
  }
  @keyframes luncur {
    0% { transform: translateX(0) rotate(-10deg); }
    100% { transform: translateX(100px) rotate(10deg); }
  }

  /* 2. Rotasi (Persegi Hijau Berputar) */
  .rotasi-obj {
    bottom: 20%;
    right: 15%;
    animation: putar 6s linear infinite;
  }
  @keyframes putar {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* 3. Dilatasi (Lingkaran Kuning Berdenyut) */
  .dilatasi-obj {
    top: 20%;
    right: 10%;
    animation: kembangKempis 3s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
  }
  @keyframes kembangKempis {
    0% { transform: scale(0.7); }
    100% { transform: scale(1.3); }
  }

  /* 4. Refleksi (Dua Setengah Lingkaran Merah Memantul) */
  .refleksi-obj {
    bottom: 15%;
    left: 15%;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .cermin-kiri { animation: cermin1 2s ease-in-out infinite alternate; }
  .cermin-kanan { animation: cermin2 2s ease-in-out infinite alternate; }
  
  @keyframes cermin1 { 0% { transform: translateX(10px); } 100% { transform: translateX(-10px); } }
  @keyframes cermin2 { 0% { transform: translateX(-10px) scaleX(-1); } 100% { transform: translateX(10px) scaleX(-1); } }

  /* Garis cermin */
  .garis-cermin {
    height: 80px;
    width: 4px;
    background: var(--tinta);
    border-radius: 2px;
    border-style: dashed;
  }

  /* Wajah Lucu pada SVG */
  .mata { fill: var(--tinta); }
  .pipi { fill: rgba(255, 138, 61, 0.6); }
  .mulut { fill: none; stroke: var(--tinta); stroke-width: 4; stroke-linecap: round; }

  @media(max-width: 768px) {
    .karakter { transform: scale(0.7); }
    .translasi-obj { top: 5%; left: -5%; }
    .dilatasi-obj { top: 5%; right: -5%; }
    .rotasi-obj { bottom: 5%; right: 0; }
    .refleksi-obj { bottom: 5%; left: 0; }
  }

</style>
</head>
<body>

<!-- Latar Belakang -->
<div class="latar"></div>
<div class="grid-pattern"></div>

<div class="kanvas-animasi" id="kanvasParalaks">
  
  <!-- Segitiga (Translasi) -->
  <div class="karakter translasi-obj" data-speed="3">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <!-- Bentuk Segitiga -->
      <polygon points="60,10 110,100 10,100" fill="var(--biru)" stroke="var(--tinta)" stroke-width="6" stroke-linejoin="round"/>
      <!-- Wajah Senyum -->
      <circle cx="45" cy="70" r="6" class="mata"/>
      <circle cx="75" cy="70" r="6" class="mata"/>
      <ellipse cx="35" cy="75" rx="8" ry="4" class="pipi"/>
      <ellipse cx="85" cy="75" rx="8" ry="4" class="pipi"/>
      <path d="M 50 80 Q 60 90 70 80" class="mulut"/>
    </svg>
  </div>

  <!-- Persegi (Rotasi) -->
  <div class="karakter rotasi-obj" data-speed="-4">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <!-- Bentuk Persegi -->
      <rect x="10" y="10" width="80" height="80" rx="15" fill="var(--hijau)" stroke="var(--tinta)" stroke-width="6"/>
      <!-- Wajah Kaget/Pusing -->
      <circle cx="35" cy="40" r="7" class="mata"/>
      <circle cx="65" cy="40" r="7" class="mata"/>
      <path d="M 35 40 L 40 45 M 35 45 L 40 40" stroke="var(--krem)" stroke-width="3" stroke-linecap="round"/> <!-- Mata bintang silang -->
      <path d="M 60 40 L 65 45 M 60 45 L 65 40" stroke="var(--krem)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="65" r="8" fill="var(--tinta)"/> <!-- Mulut O -->
    </svg>
  </div>

  <!-- Lingkaran (Dilatasi) -->
  <div class="karakter dilatasi-obj" data-speed="2">
    <svg width="110" height="110" viewBox="0 0 110 110">
      <!-- Bentuk Lingkaran -->
      <circle cx="55" cy="55" r="45" fill="var(--kuning)" stroke="var(--tinta)" stroke-width="6"/>
      <!-- Wajah Semangat -->
      <path d="M 35 45 Q 40 35 45 45" fill="none" stroke="var(--tinta)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 65 45 Q 70 35 75 45" fill="none" stroke="var(--tinta)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 40 60 Q 55 80 70 60 Z" fill="var(--merah)" stroke="var(--tinta)" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Setengah Lingkaran (Refleksi) -->
  <div class="karakter refleksi-obj" data-speed="-3">
    <!-- Bentuk Kiri -->
    <svg width="60" height="100" viewBox="0 0 60 100" class="cermin-kiri">
      <path d="M 50 10 A 40 40 0 0 0 50 90 Z" fill="var(--merah)" stroke="var(--tinta)" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="35" cy="40" r="5" class="mata"/>
      <path d="M 40 60 Q 30 70 30 60" class="mulut"/>
    </svg>
    
    <!-- Garis Cermin -->
    <div class="garis-cermin"></div>

    <!-- Bentuk Kanan (Cermin) -->
    <svg width="60" height="100" viewBox="0 0 60 100" class="cermin-kanan">
      <path d="M 50 10 A 40 40 0 0 0 50 90 Z" fill="var(--merah)" stroke="var(--tinta)" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="35" cy="40" r="5" class="mata"/>
      <path d="M 40 60 Q 30 70 30 60" class="mulut"/>
    </svg>
  </div>

</div>

<main class="wadah-utama">
  <div class="label-fase">Matematika SMP - Fase D</div>
  
  <h1 class="judul">Transformasi<br><span>Geometri</span></h1>
  
  <p class="deskripsi">
    Bersiaplah untuk meluncur, berputar, bercermin, dan membesar! Mari pecahkan teka-teki ruang koordinat dengan cara yang seru.
  </p>
  
  <a href="koordinat_kartesius_tahap1_2.html" class="tbl-mulai">
    <!-- Ikon Play Bintang -->
    <svg viewBox="0 0 24 24">
      <path d="M8 5.14V19.07a1 1 0 0 0 1.5.86l10.4-6.96a1 1 0 0 0 0-1.68L9.5 4.28A1 1 0 0 0 8 5.14Z"/>
    </svg>
    Mulai Petualangan!
  </a>

  <div class="kredit">
    Media Pembelajaran Interaktif oleh<br>
    <b>Fivigati Nurhayati (Fivi)</b><br>
    SMP Negeri 28 Malang
  </div>
</main>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const kanvasParalaks = document.getElementById('kanvasParalaks');
    const karakterList = document.querySelectorAll('.karakter');
    
    let kursorX = 0;
    let kursorY = 0;
    let targetX = 0;
    let targetY = 0;

    // Fungsi untuk memperbarui posisi target saat kursor bergerak / sentuh
    function updateKursor(x, y) {
      // Normalisasi posisi dari -1 (kiri/atas) ke 1 (kanan/bawah)
      targetX = (x / window.innerWidth) * 2 - 1;
      targetY = (y / window.innerHeight) * 2 - 1;
    }

    window.addEventListener('mousemove', (e) => {
      updateKursor(e.clientX, e.clientY);
    });

    // Dukungan untuk perangkat sentuh (HP/Tablet)
    window.addEventListener('touchmove', (e) => {
      if(e.touches.length > 0) {
        updateKursor(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    // Loop animasi yang mulus
    function renderParalaks() {
      // Lerp (Linear Interpolation) agar gerakannya halus (karet)
      kursorX += (targetX - kursorX) * 0.1;
      kursorY += (targetY - kursorY) * 0.1;

      karakterList.forEach(karakter => {
        const kecepatan = parseFloat(karakter.getAttribute('data-speed'));
        
        // Menghitung pergeseran paralaks
        const xPos = kursorX * kecepatan * 20; // 20 adalah intensitas maksimal
        const yPos = kursorY * kecepatan * 20;
        
        // Kita gunakan CSS Custom Property untuk menimpa transform
        // tanpa merusak animasi keyframes (luncur, putar, dll) yang berjalan di base class
        // Trick: Kita bungkus karakter dalam wrapper jika ingin paralaks 100% sempurna tanpa konflik keyframes.
        // Karena di CSS kita pakai animation transform, kita set margin atau padding via JS saja agar aman.
        karakter.style.marginLeft = `${xPos}px`;
        karakter.style.marginTop = `${yPos}px`;
      });

      requestAnimationFrame(renderParalaks);
    }

    renderParalaks();
  });
</script>

</body>
</html>
