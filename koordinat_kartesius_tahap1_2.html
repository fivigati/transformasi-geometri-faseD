<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Galaksi Misi - Transformasi Geometri</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #3E2F25;
    --putih: #ffffff;
    --kuning: #FFC43D;
    --biru: #3E8FEA;
    --hijau: #34B36B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: #0B0B2A;
    min-height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Wadah Peta responsif dengan aspect ratio 16:9 agar pas di layar tanpa kosong */
  .wadah-peta {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    background-image: url('Peta Perjalanan Belajar Galaksi Bercahaya.png');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Di layar HP atau potret, izinkan scroll jika diperlukan */
  @media (max-aspect-ratio: 16/9) {
    .wadah-peta {
      width: 100vw;
      height: calc(100vw * 9 / 16);
    }
  }

  .hud-atas {
    position: absolute;
    top: 25px;
    left: 30px;
    right: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }

  .kartu-pemain {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 22px;
    border-radius: 999px;
    border: 2px solid var(--putih);
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    color: var(--tinta);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .tbl-reset {
    background: #F0577A;
    color: var(--putih);
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    border: none;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(240,87,122,0.4);
    transition: transform 0.2s;
  }
  .tbl-reset:hover { transform: scale(1.05); }

  .pos-pulau {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tombol-pulau {
    width: clamp(36px, 4.5vw, 64px);
    height: clamp(36px, 4.5vw, 64px);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: transparent;
    background: transparent;
    border: 3px solid transparent;
    transition: all 0.2s ease;
  }

  .pos-pulau.terbuka .tombol-pulau:hover,
  .pos-pulau:hover .tombol-pulau {
    border: 3px solid var(--kuning);
    background: rgba(255, 196, 61, 0.15);
    animation: denyutPulau 1.5s infinite alternate;
  }

  @keyframes denyutPulau {
    to { transform: scale(1.08); }
  }

  /* Khusus Final Tes */
  .pos-pulau.final .tombol-pulau {
    width: clamp(100px, 14vw, 180px);
    height: clamp(50px, 6.5vw, 80px);
    border-radius: 20px;
  }

  .tooltip-misi {
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    color: var(--tinta);
    font-family: 'Baloo 2', cursive;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 12px;
    white-space: nowrap;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    border: 2px solid var(--biru);
    z-index: 30;
  }

  .pos-pulau:hover .tooltip-misi {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <div class="wadah-peta" id="petaGalaksi">
    <!-- HUD Atas Nama Siswa & Reset -->
    <div class="hud-atas">
      <div class="kartu-pemain" id="infoPemain">🚀 Penjelajah: Tamu</div>
      <button class="tbl-reset" onclick="resetProgres()">Reset Misi</button>
    </div>

    <!-- Pos 1 -->
    <div class="pos-pulau" style="top: 59.5%; left: 9.3%;" onclick="pilihLevel(1)" data-id="1">
      <div class="tooltip-misi">1. Mengenal Koordinat Kartesius</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 2 -->
    <div class="pos-pulau" style="top: 45.5%; left: 18.2%;" onclick="pilihLevel(2)" data-id="2">
      <div class="tooltip-misi">2. Tes Mengenal Koordinat Kartesius</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 3 -->
    <div class="pos-pulau" style="top: 29.5%; left: 28.5%;" onclick="pilihLevel(3)" data-id="3">
      <div class="tooltip-misi">3. Refleksi / Pencerminan</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 4 -->
    <div class="pos-pulau" style="top: 17.5%; left: 42.2%;" onclick="pilihLevel(4)" data-id="4">
      <div class="tooltip-misi">4. Tes tentang Pencerminan</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 5 -->
    <div class="pos-pulau" style="top: 23.5%; left: 58.5%;" onclick="pilihLevel(5)" data-id="5">
      <div class="tooltip-misi">5. Translasi (Pergeseran)</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 6 -->
    <div class="pos-pulau" style="top: 11.5%; left: 71.8%;" onclick="pilihLevel(6)" data-id="6">
      <div class="tooltip-misi">6. Tes Translasi</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 7 -->
    <div class="pos-pulau" style="top: 35.8%; left: 84.8%;" onclick="pilihLevel(7)" data-id="7">
      <div class="tooltip-misi">7. Rotasi (Perputaran)</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 8 -->
    <div class="pos-pulau" style="top: 48.0%; left: 67.5%;" onclick="pilihLevel(8)" data-id="8">
      <div class="tooltip-misi">8. Tes Rotasi</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 9 -->
    <div class="pos-pulau" style="top: 54.0%; left: 51.5%;" onclick="pilihLevel(9)" data-id="9">
      <div class="tooltip-misi">9. Dilatasi (Perbesaran)</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 10 -->
    <div class="pos-pulau" style="top: 64.5%; left: 36.2%;" onclick="pilihLevel(10)" data-id="10">
      <div class="tooltip-misi">10. Tes Dilatasi</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Pos 11 -->
    <div class="pos-pulau" style="top: 76.5%; left: 54.8%;" onclick="pilihLevel(11)" data-id="11">
      <div class="tooltip-misi">11. Pos Menengah Akhir</div>
      <div class="tombol-pulau"></div>
    </div>

    <!-- Final Tes -->
    <div class="pos-pulau final" style="top: 84.0%; left: 81.8%;" onclick="pilihLevel(12)" data-id="12">
      <div class="tooltip-misi">Final Tes Misi</div>
      <div class="tombol-pulau"></div>
    </div>
  </div>

  <script>
    const namaSiswa = localStorage.getItem('geoQuest_Nama');
    const asalSekolah = localStorage.getItem('geoQuest_Sekolah');
    if (namaSiswa) {
      document.getElementById('infoPemain').innerHTML = `🚀 Penjelajah: ${namaSiskwa = namaSiswa} (${asalSekolah || 'Siswa'})`;
      // Let's fix assignment typo above just in case
      document.getElementById('infoPemain').innerHTML = `🚀 Penjelajah: ${namaSiswa} (${asalSekolah || 'Siswa'})`;
    }

    function getMaxLevelTerbuka() {
      return parseInt(localStorage.getItem('geoQuest_MaxLevel') || '1');
    }

    function perbaruiPeta() {
      const maxLevel = getMaxLevelTerbuka();
      const pulauList = document.querySelectorAll('.pos-pulau');

      pulauList.push = undefined; // just ensure querySelectorAll returns NodeList
      pulauList.forEach(pulau => {
        const idLevel = parseInt(pulau.getAttribute('data-id'));
        pulau.style.opacity = (idLevel <= maxLevel) ? "1" : "0.4";
      });
    }

    function pilihLevel(idLevel) {
      const maxLevel = getMaxLevelTerbuka();

      if (idLevel > maxLevel) {
        alert("🔒 Pulau ini masih terkunci! Selesaikan misi sebelumnya terlebih dahulu ya.");
        return;
      }

      if (idLevel === 1) {
        window.location.href = "koordinat_kartesius_tahap1_2.html";
      } else {
        alert(`Mengarahkan ke Pos ${idLevel}: Selamat belajar!`);
        if (idLevel === maxLevel && maxLevel < 5) {
          localStorage.setItem('geoQuest_MaxLevel', maxLevel + 1);
          perbaruiPeta();
        }
      }
    }

    function resetProgres() {
      if (confirm("Yakin ingin mereset semua progres galaksi dari awal?")) {
        localStorage.setItem('geoQuest_MaxLevel', '1');
        perbaruiPeta();
      }
    }

    perbaruiPeta();
  </script>

</body>
</html>
